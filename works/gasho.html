<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Gasho — Kyota Ikuyama</title>
<script>
  // 保存した設定があればそれを、なければ OS の設定を使う
  (function () {
    var saved = null;
    try { saved = localStorage.getItem("theme"); } catch (e) {}
    var dark = saved ? saved === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    document.documentElement.dataset.theme = dark ? "dark" : "light";
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400&amp;family=Noto+Sans+JP:wght@400&amp;display=swap">
<link rel="stylesheet" href="../style.css">
</head>
<body>
<div class="topbar">
  <button class="theme" type="button" aria-pressed="false" aria-label="ダークモード" title="ダークモード">
    <img class="icon to-dark" src="../assets/icons/moon.svg" width="48" height="48" alt="">
    <img class="icon to-light" src="../assets/icons/sun.svg" width="48" height="48" alt="">
  </button>
</div>
<main>
  <a class="back" href="../index.html#projects"><img class="icon" src="../assets/icons/chevron-right.svg" width="24" height="24" alt=""><span>Projects.</span></a>
  <article class="work tint-gasho">
    <div class="player">
      <video src="../videos/gasho.mp4" poster="../posters/gasho.jpg" controls muted loop playsinline preload="metadata" aria-label="Gasho の紹介動画"></video>
    </div>
    <div class="info">
      <h1>Gasho</h1>
      <p class="desc">複数のマシンの Claude Code を、1 画面で動かす</p>
      <a class="repo" href="https://github.com/4rtofl/Gasho" aria-label="Gasho の GitHub" title="GitHub"><span class="gh"><img class="icon" src="../assets/icons/github.svg" width="29" height="32" alt=""></span></a>
    </div>
  </article>
</main>
<script src="../site.js"></script>
</body>
</html>
